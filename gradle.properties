# ========================================================================
# VODML-Mapper Gradle Configuration
# ========================================================================

# Project settings
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=true

# Java version
# Note: Change this if you want to target a different Java version
# Supported values: 1.8, 11, 17, 21
javaVersion=1.8

# Build output
org.gradle.console=auto
org.gradle.warning.mode=all

# WAR file configuration
warArchiveBaseName=vodml-mapper
warArchiveVersion=1.0.0-SNAPSHOT

# Database configuration (for reference - actual config in web.xml)
# MongoDB settings
mongodbHost=localhost
mongodbPort=27017
mongodbDatabase=vodmlmapper

# SQL Server settings
sqlserverHost=localhost
sqlserverPort=1433
sqlserverDatabase=vodmlmapper

# Development mode settings
# Set to true to include debug symbols and disable optimization
debugMode=true
