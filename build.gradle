plugins {
    id 'java'
    id 'war'
    id 'eclipse'
    id 'idea'
}

group = 'org.ivoa.vodml'
version = '1.0.0-SNAPSHOT'

// Java version configuration for Java 17
java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

// Source sets configuration - using standard Gradle layout
sourceSets {
    main {
        java {
            srcDirs = ['src/main/java', 'jaxb-gen']
        }
        resources {
            srcDirs = ['src/main/resources']
        }
    }
    test {
        java {
            srcDirs = ['src/test/java']
        }
        resources {
            srcDirs = ['src/test/resources']
        }
    }
}

// Repository configuration
repositories {
    mavenCentral()

    // Flatdir repository for local JAR files (e.g., STIL)
    flatDir {
        dirs 'libs'
    }
}

// Dependency versions for Java 17
ext {
    servletApiVersion = '6.0.0'  // Jakarta EE 10 compatible with Java 17+
    mongoDriverVersion = '4.11.1'
    sqlServerDriverVersion = '12.6.0.jre11'  // jre11 works with Java 17
    httpClientVersion = '4.5.14'
    commonsIoVersion = '2.15.1'
    commonsFileUploadVersion = '2.0.0-M2'  // Jakarta-compatible version
    log4jVersion = '2.22.1'
    jsonVersion = '20240205'

    // JAXB versions - using Jakarta EE 10 for Java 17+
    jaxbApiVersion = '4.0.1'
    jaxbRuntimeVersion = '4.0.4'
    jaxbXjcVersion = '4.0.4'

    stilVersion = '4.1.6'
    stilUrl = 'https://www.star.bristol.ac.uk/mbt/stil/stil.jar'
    stilJarName = 'stil.jar'
}

// Task to download STIL JAR if not present
task downloadStil {
    group = 'build setup'
    description = 'Download STIL library JAR from Bristol University'

    def stilJar = file("libs/${stilJarName}")

    outputs.file stilJar
    outputs.upToDateWhen { stilJar.exists() }

    doLast {
        if (!stilJar.exists()) {
            logger.lifecycle("Downloading STIL library from ${stilUrl}")

            // Create libs directory if it doesn't exist
            stilJar.parentFile.mkdirs()

            // Download the JAR
            new URL(stilUrl).withInputStream { input ->
                stilJar.withOutputStream { output ->
                    output << input
                }
            }

            logger.lifecycle("STIL library downloaded to ${stilJar}")
        } else {
            logger.lifecycle("STIL library already exists at ${stilJar}")
        }
    }
}

// Configuration for JAXB XJC compiler tools
configurations {
    jaxb
}

dependencies {
    // Servlet API (provided by container) - Jakarta EE 10 for Java 17+
    providedCompile "jakarta.servlet:jakarta.servlet-api:${servletApiVersion}"

    // JAXB Runtime (Jakarta XML Binding for Java 17+)
    implementation "jakarta.xml.bind:jakarta.xml.bind-api:${jaxbApiVersion}"
    implementation "org.glassfish.jaxb:jaxb-runtime:${jaxbRuntimeVersion}"

    // EclipseLink MOXy (alternative JAXB implementation used by some classes)
    implementation "org.eclipse.persistence:org.eclipse.persistence.moxy:4.0.2"

    // JAXB XJC tools (for code generation only - not in runtime)
    jaxb "org.glassfish.jaxb:jaxb-xjc:${jaxbXjcVersion}"
    jaxb "org.glassfish.jaxb:jaxb-runtime:${jaxbRuntimeVersion}"
    jaxb "jakarta.xml.bind:jakarta.xml.bind-api:${jaxbApiVersion}"
    jaxb "jakarta.activation:jakarta.activation-api:2.1.2"

    // Database drivers
    implementation "org.mongodb:mongodb-driver-sync:${mongoDriverVersion}"
    implementation "com.microsoft.sqlserver:mssql-jdbc:${sqlServerDriverVersion}"

    // Apache HTTP Client
    implementation "org.apache.httpcomponents:httpclient:${httpClientVersion}"
    implementation "org.apache.httpcomponents:httpcore:4.4.16"

    // Apache Commons
    implementation "commons-io:commons-io:${commonsIoVersion}"
    // Apache Commons FileUpload 2.x (Jakarta-compatible)
    implementation "org.apache.commons:commons-fileupload2-jakarta-servlet6:${commonsFileUploadVersion}"

    // Logging
    implementation "org.apache.logging.log4j:log4j-api:${log4jVersion}"
    implementation "org.apache.logging.log4j:log4j-core:${log4jVersion}"

    // JSON
    implementation "org.json:json:${jsonVersion}"

    // Starlink STIL (VOTable parsing) - downloaded from Bristol University
    // The JAR is automatically downloaded by the downloadStil task
    implementation files("libs/${stilJarName}")

    // Test dependencies
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:5.10.0'
}

// War plugin configuration
war {
    archiveBaseName = 'vodml-mapper'
    archiveVersion = version

    // Include web content
    from('WebContent') {
        exclude 'WEB-INF/web.xml.template'
        exclude 'WEB-INF/lib/**'
    }

    // Use template if web.xml doesn't exist
    webXml = file('WebContent/WEB-INF/web.xml.template')

    // Include dependencies in WEB-INF/lib
    classpath configurations.runtimeClasspath
}

// Task to generate JAXB classes from XSD schemas
task generateJaxb {
    group = 'build'
    description = 'Generate JAXB classes from XSD schemas using Jakarta JAXB for Java 17+'

    def xsdDir = file('WebContent/xsd')
    def outputDir = file('jaxb-gen')

    inputs.dir xsdDir
    outputs.dir outputDir

    doLast {
        // Create output directory if it doesn't exist
        outputDir.mkdirs()

        // Define XSD to package mappings
        def schemas = [
            [schema: 'vo-dml-v1.0.xsd', package: 'org.ivoa.vodml.jaxb'],
            [schema: 'VO-DML_Mapper.xsd', package: 'org.ivoa.vodml.mapper.jaxb'],
            [schema: 'vo-dml.models.xsd', package: 'org.ivoa.vodml.jaxb'],
            [schema: 'vo-dml.mapping.xsd', package: 'org.ivoa.vodml.mapping.jaxb'],
            [schema: 'VOTable-1.4_vodml.xsd', package: 'org.ivoa.votable_1_4.jaxb',
             binding: 'votable_xjcConfig-1.4.xml', extension: true],
            [schema: 'VOTable-1.3.xsd', package: 'org.ivoa.votable.jaxb',
             binding: 'votable_xjcConfig-1.3.xml', extension: true],
            [schema: 'vo-dml-instance.xsd', package: 'org.ivoa.vodml.instance.jaxb',
             binding: 'vodmli_xjcConfig.xml', extension: true]
        ]

        // Generate JAXB classes for each schema
        schemas.each { schemaConfig ->
            def schemaFile = new File(xsdDir, schemaConfig.schema)

            if (!schemaFile.exists()) {
                logger.warn("Schema file not found: ${schemaFile}")
                return
            }

            logger.lifecycle("Generating JAXB classes for ${schemaConfig.schema}")

            // Build XJC arguments
            def xjcArgs = [
                '-d', outputDir.absolutePath,
                '-p', schemaConfig.package,
                schemaFile.absolutePath
            ]

            // Add binding file if specified
            if (schemaConfig.binding) {
                def bindingFile = new File(xsdDir, schemaConfig.binding)
                if (bindingFile.exists()) {
                    xjcArgs.addAll(['-b', bindingFile.absolutePath])
                } else {
                    logger.warn("Binding file not found: ${bindingFile}")
                }
            }

            // Add extension flag if specified
            if (schemaConfig.extension) {
                xjcArgs.add('-extension')
            }

            // Add verbose flag for debugging
            xjcArgs.add('-verbose')

            // Execute XJC using Jakarta JAXB
            ant.taskdef(
                name: 'xjc',
                classname: 'com.sun.tools.xjc.XJCTask',
                classpath: configurations.jaxb.asPath
            )

            ant.xjc(
                destdir: outputDir.absolutePath,
                package: schemaConfig.package,
                schema: schemaFile.absolutePath,
                extension: schemaConfig.extension ?: false
            ) {
                if (schemaConfig.binding) {
                    def bindingFile = new File(xsdDir, schemaConfig.binding)
                    if (bindingFile.exists()) {
                        binding(dir: xsdDir.absolutePath, includes: schemaConfig.binding)
                    }
                }
                // Allow access to external schemas
                arg(value: '-nv')  // Disable strict validation
            }

            logger.lifecycle("Generated JAXB classes for ${schemaConfig.schema} -> ${schemaConfig.package}")
        }

        logger.lifecycle("JAXB generation completed successfully")
    }
}

// Make compileJava depend on generateJaxb and downloadStil
compileJava.dependsOn generateJaxb, downloadStil

// Clean task to remove generated JAXB classes
clean {
    delete 'jaxb-gen'
}

// Task to copy dependencies to WEB-INF/lib (for manual deployment)
task copyDependencies(type: Copy) {
    group = 'build'
    description = 'Copy runtime dependencies to WebContent/WEB-INF/lib'

    from configurations.runtimeClasspath
    into 'WebContent/WEB-INF/lib'
}

// Task to create web.xml from template if it doesn't exist
task createWebXml {
    group = 'build'
    description = 'Create web.xml from template if it does not exist'

    doLast {
        def webXmlFile = file('WebContent/WEB-INF/web.xml')
        def templateFile = file('WebContent/WEB-INF/web.xml.template')

        if (!webXmlFile.exists() && templateFile.exists()) {
            logger.lifecycle("Creating web.xml from template")
            webXmlFile.text = templateFile.text
            logger.lifecycle("NOTE: Please configure database connection parameters in web.xml")
        } else if (webXmlFile.exists()) {
            logger.lifecycle("web.xml already exists, skipping")
        } else {
            logger.warn("Template file not found: ${templateFile}")
        }
    }
}

// Task to run SQL Server schema setup
task setupSqlServer {
    group = 'database'
    description = 'Display instructions for SQL Server setup'

    doLast {
        println """
========================================
SQL Server Setup Instructions
========================================

To set up SQL Server database for VODML-Mapper:

1. Create the database:
   sqlcmd -S localhost -U sa -Q "CREATE DATABASE vodmlmapper"

2. Run the schema script:
   sqlcmd -S localhost -U sa -d vodmlmapper -i sql/sqlserver_schema.sql

3. Configure web.xml with SQL Server connection parameters:
   - sqlserver-host
   - sqlserver-port
   - sqlserver-database
   - sqlserver-user
   - sqlserver-pwd

See sql/README.md for detailed instructions.
========================================
"""
    }
}

// Eclipse integration
eclipse {
    classpath {
        downloadSources = true
        downloadJavadoc = true
    }

    wtp {
        component {
            contextPath = 'vodml-mapper'
        }
    }
}

// Compiler options for Java 17
tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Xlint:unchecked'
    options.compilerArgs << '-Xlint:deprecation'

    // Java 17 release flag
    options.release = 17
}

// Display project information
task projectInfo {
    group = 'help'
    description = 'Display project information'

    doLast {
        println """
========================================
VODML-Mapper Build Information
========================================
Project: ${project.name}
Group: ${project.group}
Version: ${project.version}
Java: ${java.sourceCompatibility}
Java Toolchain: Java ${java.toolchain.languageVersion.get()}

Main Tasks:
  gradle build         - Build project and create WAR
  gradle war           - Create WAR file
  gradle generateJaxb  - Generate JAXB classes from XSD
  gradle downloadStil  - Download STIL library JAR (auto-run by build)
  gradle clean         - Clean build artifacts
  gradle copyDeps      - Copy dependencies to WEB-INF/lib
  gradle test          - Run tests
  gradle eclipse       - Generate Eclipse project files
  gradle idea          - Generate IntelliJ IDEA project files

Database Tasks:
  gradle setupSqlServer - Display SQL Server setup instructions

See CLAUDE.md for detailed documentation.
========================================
"""
    }
}

// Alias for copyDependencies
task copyDeps {
    dependsOn copyDependencies
}

// Default task
defaultTasks 'build'
