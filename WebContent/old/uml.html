<script type="text/javascript" >
	/////////////////////////////////////////////////////////////////////////
	// static variables giving name of remote json files to be retrieved for initialisation
	/////////////////////////////////////////////////////////////////////////

	var controller;
	var myLayout;
</script>

<style type="text/css">
.header { 
	background: #D8EEEE;
    font-weight: bold;
	text-align: center;
	padding: 2px 0 4px;
	position: relative;
	overflow: hidden;
}
/**
      *Basic Layout Theme
       * 
      *This theme uses the default layout class-names for all classes
      *Add any 'custom class-names', from options: paneClass, resizerClass,
      togglerClass
       */
.ui-layout-pane { /* all 'panes' */
	background: #FFF;
	border: 1px solid #BBB;
	padding: 10px;
	overflow: auto;
}

.ui-layout-resizer { /* all 'resizer-bars' */
	background: #D8EEEE;
}

.ui-layout-toggler { /* all 'toggler-buttons' */
	background: #008B8B;
}
</style>
</head>
<body>

	<!--  NORTH  -->
	<div class="ui-layout-north" >
<h1 class="title" >The VO-DML Annotater</h1>
<!-- 
<button name="add resizable" onclick="addResizable('#mapperdiv')" value="">Add resizable</button>
 -->
 		</div>
	

	<!--  EAST: model in tree view   -->
	<div class="ui-layout-east" onmouseout="myLayout.resetOverflow(this)">
		<div class="header">
			<h2>Table Management</h2>
		</div>
		<div id="tables"></div>
	</div>

	<!--    CENTER  -->
	<div id="mapperdiv" class="ui-layout-center  jstree-drop mapper" onmouseout="myLayout.resetOverflow(this)">
	</div>

	<!--    EAST  -->
	<div class="ui-layout-west" onmouseout="myLayout.resetOverflow(this)">
		<div class="header">
			<h2>Models</h2>
		</div>
		<div id="modelstreediv"></div>
	</div>

	<script>
		jQuery(document).ready(function() {

			var conf = new Config();
//			conf.tablesDiv = "tablesdiv";
			conf.modelsDiv = "modelsdiv";
			conf.mappingDiv = "mapperdiv";
			conf.modelsTreeDiv = "modelstreediv";
			controller = new VODMLMapper.BaseController(conf);

			myLayout = jQuery('body').layout({
				spacing_open : 8,
				spacing_closed : 12,
				north__togglerLength_open : 100,
				north__togglerLength_closed : 100,
				north__resizable : false,
				west__size : 400,
				east__size : 400
			});

			controller.init();

		});
	</script>

</body>
