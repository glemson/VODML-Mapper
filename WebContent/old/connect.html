<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN" "http://www.w3.org/TR/html4/loose.dtd">
<html>
<head>
<!-- 
    <script type="text/javascript" src="js/jquery-1.8.3.js"></script>
    <script type="text/javascript" src="js/jquery-ui-1.9.2.custom.js"></script>
 -->
<script src="http://code.jquery.com/jquery-1.9.1.js"></script>
<script src="http://code.jquery.com/ui/1.10.3/jquery-ui.js"></script>
<script type="text/javascript" src="js/jquery.jsPlumb-1.4.1-all.js"></script>
<script>
jsPlumb.ready(function() {
  jsPlumb.makeSource($('.item'), {
    connector: 'StateMachine'
  });
  jsPlumb.makeTarget($('.item'), {
    anchor: 'Continuous'
  });
});
</script>
<style type="text/css">
.item {
  position:relative;
	border: 1px solid black;
	background-color: #ddddff;
	width: 100px;
	height: 100px;
}

#state1 {
	left: 100px;
	top: 100px;
}

#state2 {
	left: 250px;
	top: 100px;
}

#state3 {
	left: 100px;
	top: 250px;
}
</style>

<title>Getting started with jsPlumb</title>
</head>

<body>
	<div id="state1" class="item"></div>
	<div id="state2" class="item"></div>
	<div id="state3" class="item"></div>


</body>
</html>
